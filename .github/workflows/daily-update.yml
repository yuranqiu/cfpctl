name: Daily Official Data Update

on:
  schedule:
    # 00:00 UTC / 08:00 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: '0 0 * * *'
  workflow_dispatch:

# The application repository is only a source of updater code.
permissions:
  contents: read

concurrency:
  group: daily-official-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require data repository token
        env:
          DATA_TOKEN: ${{ secrets.CFPCTL_DATA_TOKEN }}
        run: |
          if [ -z "$DATA_TOKEN" ]; then
            echo '::error::Set CFPCTL_DATA_TOKEN with contents and pull requests write access to yuranqiu/cfpctl-data.'
            exit 1
          fi

      - name: Checkout maintained data repository
        uses: actions/checkout@v4
        with:
          repository: yuranqiu/cfpctl-data
          ref: main
          path: .upstream/cfpctl-data
          token: ${{ secrets.CFPCTL_DATA_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Test data update scripts
        run: python -m unittest discover -s scripts/tests

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test and build validator
        run: |
          go test ./...
          go build -o "$RUNNER_TEMP/cfpctl" .

      - name: Update maintained data from official conference websites
        run: >-
          python scripts/update_official.py
          --data-dir .upstream/cfpctl-data
          --report "$RUNNER_TEMP/official-report.json"
          --summary "$RUNNER_TEMP/official-report.md"
          --cache-dir "$RUNNER_TEMP/official-pages"
          --apply --workers 4 --timeout 20

      - name: Validate maintained data
        run: '"$RUNNER_TEMP/cfpctl" validate --data-dir .upstream/cfpctl-data'

      # The action maintains one PR in cfpctl-data and closes stale no-change PRs.
      - name: Create or update data pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CFPCTL_DATA_TOKEN }}
          path: .upstream/cfpctl-data
          base: main
          add-paths: |
            ai.yaml
            database.yaml
            graphics.yaml
            hci.yaml
            interdisciplinary.yaml
            network.yaml
            security.yaml
            software.yaml
            systems.yaml
            theory.yaml
          commit-message: "chore(data): update deadlines from official conference websites"
          title: "Daily official conference data update"
          body-path: ${{ runner.temp }}/official-report.md
          branch: auto/official-update
          delete-branch: true

      - name: Publish update summary
        if: always()
        env:
          PR_OPERATION: ${{ steps.pull-request.outputs.pull-request-operation }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          if [ -f "$RUNNER_TEMP/official-report.md" ]; then
            cat "$RUNNER_TEMP/official-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Pull request operation: ${PR_OPERATION:-none}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_URL" ]; then
            echo "Pull request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload official update report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-update-report
          path: |
            ${{ runner.temp }}/official-report.json
            ${{ runner.temp }}/official-report.md
            ${{ runner.temp }}/official-pages/
          if-no-files-found: warn
          retention-days: 14
